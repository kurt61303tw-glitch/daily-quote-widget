<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>每日經典勉勵名句</title>
  <style>
    :root { color-scheme:light dark; --ink:#5a2d20; --plum:#774052; --plum-dark:#5c2f3e; --cream:#ead8bd; --cream-light:#fffaf1; --sky:#e4f3ff; --line:#89654f; --muted:#7a6658; --page-bg:#191919; }
    @media (prefers-color-scheme: light) { :root { --page-bg:#ffffff; } }
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; background:var(--page-bg) !important; }
    body { padding:0; color:var(--ink); font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; }
    button,input,textarea { font:inherit; }
    .widget { position:relative; isolation:isolate; overflow:hidden; width:100%; max-width:none; margin:0; padding:0; border:0; background:transparent; box-shadow:none; }
    .quote-card, .list-toggle, .quote-list { border:1.5px solid var(--line); background:linear-gradient(105deg,#ead8bd,#f6ead7 46%,#ead8bd); }
    .quote-card { position:relative; isolation:isolate; display:grid; grid-template-columns:190px minmax(200px,1fr) auto; gap:18px; align-items:center; min-height:108px; padding:20px 18px; overflow:hidden; }
    .blossoms { position:absolute; z-index:2; left:10px; top:4px; font-size:16px; letter-spacing:-4px; transform:rotate(-10deg); opacity:.68; filter:hue-rotate(24deg) saturate(1.25) brightness(1.08); pointer-events:none; }
    .identity { position:relative; z-index:2; padding-right:16px; border-right:1px solid #a98368; }
    .identity h1 { margin:0 0 5px; font-size:17px; font-weight:750; letter-spacing:.02em; }
    .identity p { margin:0; color:var(--muted); font-size:12px; white-space:nowrap; }
    .quote-wrap { position:relative; z-index:2; min-width:0; text-align:center; }
    .quote-viewport { width:100%; overflow:hidden; padding:5px 0; }
    blockquote { width:100%; margin:0 auto; font-family:"Noto Serif TC","PMingLiU",serif; font-size:clamp(17px,1.4vw,20px); line-height:1.45; font-weight:700; color:#914b31; white-space:normal; overflow-wrap:anywhere; }
    .quote-track.is-marquee { display:block; width:max-content; margin:0; white-space:nowrap; animation:marquee var(--marquee-duration,12s) linear infinite; will-change:transform; }
    .quote-track.is-marquee:hover, .quote-track.is-marquee:focus, .quote-track.is-marquee:focus-within { animation-play-state:paused; }
    .quote-track span { color:#a22b2b; }
    @keyframes marquee { 0% { transform:translateX(var(--marquee-start,100%)); } 100% { transform:translateX(var(--marquee-end,-100%)); } }
    .leaf-field { position:absolute; z-index:0; inset:0; overflow:hidden; pointer-events:none; }
    .leaf { position:absolute; top:-2.2rem; left:var(--x); font-size:var(--size); opacity:var(--alpha,.48); filter:hue-rotate(var(--hue,24deg)) saturate(1.28) brightness(1.08) drop-shadow(0 2px 2px #5c2f2722); animation:leaf-fall var(--duration) ease-in-out var(--delay) infinite; }
    @keyframes leaf-fall { 0% { transform:translate3d(0,-10%,0) rotate(0deg); } 28% { transform:translate3d(var(--drift),45px,0) rotate(95deg); } 62% { transform:translate3d(calc(var(--drift) * -1),105px,0) rotate(220deg); } 100% { transform:translate3d(var(--drift),175px,0) rotate(360deg); } }
    cite { display:block; margin-top:6px; color:#725044; font-style:normal; font-size:13px; }
    .controls { position:relative; z-index:2; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:7px; }
    button { min-height:36px; cursor:pointer; border:1px solid var(--line); border-radius:5px; background:#fff9ef; color:var(--ink); padding:7px 11px; transition:transform .15s, background .15s, box-shadow .15s; }
    button:hover { transform:translateY(-1px); box-shadow:0 3px 8px #4b271a22; background:#fff; }
    button:focus-visible, summary:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid #4a93c1; outline-offset:2px; }
    #next { border-color:var(--plum); color:white; background:var(--plum); }
    #next:hover { background:var(--plum-dark); }
    .heart { width:38px; padding:4px; font-size:20px; }
    .heart.is-favorite { color:#b33958; background:#fff0f3; }
    .filter.is-active { background:#e4edf3; }
    details { position:relative; z-index:2; margin-top:11px; }
    summary { position:relative; z-index:2; list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 15px; border:1.5px solid var(--line); background:#ead8bd; color:#49352d; font-size:14px; }
    summary::-webkit-details-marker { display:none; }
    summary::before { content:"⌄"; font-size:20px; line-height:0; transition:transform .2s; }
    details[open] summary::before { transform:rotate(180deg); }
    .summary-title { margin-right:auto; font-weight:700; }
    .summary-help { color:#725f54; font-size:12px; }
    .quote-list { position:relative; display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px; padding:11px; border-top:0; background:var(--cream-light); }
    .quote-item { position:relative; z-index:2; text-align:left; min-height:68px; padding:10px 12px; background:#fffdf9; border:1px solid #d8c4ab; color:#51382d; font-size:13px; }
    .quote-item.current { border:2px solid var(--plum); background:#fff3f6; }
    .quote-item small { display:block; margin-top:5px; color:#856f61; }
    .empty { grid-column:1/-1; padding:20px; text-align:center; color:var(--muted); }
    dialog { width:min(560px,calc(100% - 28px)); border:0; padding:0; color:var(--ink); box-shadow:0 20px 50px #28140a55; }
    dialog::backdrop { background:#17212b66; }
    .dialog-inner { padding:22px; background:#fffaf1; border-top:6px solid var(--plum); }
    .dialog-inner h2 { margin:0 0 14px; font-size:20px; }
    label { display:block; margin:13px 0 6px; font-weight:700; font-size:14px; }
    textarea,input[type=text] { width:100%; border:1px solid #b99e86; border-radius:4px; padding:9px; background:white; color:#3e2921; }
    textarea { min-height:95px; resize:vertical; }
    .dialog-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; margin-top:18px; }
    .danger { margin-right:auto; color:#a12929; border-color:#bb7373; }
    .primary { color:#fff; border-color:var(--plum); background:var(--plum); }
    .hint { color:var(--muted); font-size:12px; margin:8px 0 0; }
    @media (max-width:780px) { body { padding:0; } .widget { padding:0; } .quote-card { grid-template-columns:1fr; gap:12px; padding-top:29px; } .identity { padding:0 0 10px; border-right:0; border-bottom:1px solid #a98368; } .quote-wrap { text-align:left; } .controls { justify-content:flex-start; } blockquote { width:100%; font-size:18px; white-space:normal; text-align:center; } }
    @media (max-width:440px) { .controls button:not(.heart) { flex:1; } .summary-help { display:none; } }
    @media (prefers-reduced-motion:reduce) { * { transition:none!important; animation:none!important; } .leaf-field { display:none; } }
  </style>
</head>
<body>
  <main class="widget" aria-label="每日經典勉勵名句工具">
    <section class="quote-card" aria-live="polite">
      <div class="blossoms" aria-hidden="true">🍁 🍁</div>
      <header class="identity"><h1>每日經典勉勵名句</h1><p><span id="updateTime">台北 09:00 更新</span> · 共 <span id="count">30</span> 句</p></header>
      <div class="quote-wrap"><div class="quote-viewport"><blockquote id="quote" class="quote-track" tabindex="0"></blockquote></div><cite id="author"></cite></div>
      <div class="controls">
        <button class="heart" id="favorite" type="button" aria-label="收藏這句" title="收藏這句">♡</button>
        <button id="next" type="button">下一句 →</button>
        <button class="filter" id="filter" type="button" aria-pressed="false">只看收藏</button>
        <button id="manage" type="button">＋ 管理</button>
      </div>
    </section>
    <details id="listDetails">
      <summary><span class="summary-title"><span style="display:inline-block;filter:hue-rotate(24deg) saturate(1.25) brightness(1.08)">🍁</span> 全部 <span id="listCount">30</span> 句清單</span><span class="summary-help">點句子就跳到那句</span></summary>
      <div class="quote-list" id="quoteList"></div>
    </details>
  </main>
  <dialog id="editor"><form method="dialog" class="dialog-inner"><h2>管理名句</h2><label for="editQuote">名句</label><textarea id="editQuote" required></textarea><label for="editAuthor">作者／出處</label><input id="editAuthor" type="text" required><p class="hint">這項修改只會保存在此瀏覽器，適合個人化 Notion 嵌入內容。</p><div class="dialog-actions"><button id="reset" class="danger" type="button">還原預設 30 句</button><button id="deleteQuote" class="danger" type="button" style="margin-right:0">刪除這句</button><button value="cancel" type="submit" formnovalidate>取消</button><button id="addNew" type="submit">新增為新句</button><button id="save" class="primary" value="default" type="submit">儲存修改</button></div></form></dialog>
  <script>
    const defaultQuotes = [
      ['專注當下的一件事，就是對時間最好的尊重。','— 無名'],['不是每一條路都要立刻看見終點，先走好腳下這一步。','— 無名'],['真正的成長，是在不確定裡仍願意往前。','— 無名'],['你不必很厲害才開始，但要開始才會很厲害。','— 齊格勒'],['慢一點沒有關係，重要的是沒有停下來。','— 無名'],['把今天照顧好，就是為明天準備最好的自己。','— 無名'],['溫柔不是軟弱，而是選擇理解後依然保有力量。','— 無名'],['困難不會永遠停留，堅持卻會留下痕跡。','— 無名'],['每一次真誠的付出，都在為生命累積光。','— 無名'],['先完成，再完美。','— 無名'],['心有方向，步伐就不會白費。','— 無名'],['你所重複做的事，正在慢慢成為你。','— 亞里斯多德'],['比起和別人比較，更重要的是比昨天的自己前進一點。','— 無名'],['安靜做好眼前的事，時間會替你回答。','— 無名'],['勇氣不是沒有害怕，而是害怕時仍選擇前行。','— 納爾遜・曼德拉'],['把複雜留給方法，把溫度留給人。','— 無名'],['不必等到準備萬全，開始會讓你更準備好。','— 無名'],['善待自己，是走得更遠的起點。','— 無名'],['那些看似微小的選擇，終會改變你前往的方向。','— 無名'],['願你在忙碌裡，也記得為自己留一點呼吸。','— 無名'],['每一個認真生活的日子，都值得被記住。','— 無名'],['把不能改變的交給時間，把可以改變的交給行動。','— 無名'],['最好的時機也許不是昨天，而是現在。','— 無名'],['不怕步伐小，只怕心裡先放棄。','— 無名'],['學會休息，不是放棄，而是為了走更長的路。','— 無名'],['真正重要的事，值得你一次又一次地練習。','— 無名'],['你的節奏不必和任何人一樣。','— 無名'],['當你願意相信自己，世界也會多給你一點可能。','— 無名'],['讓每一次經驗，都成為下一次更從容的底氣。','— 無名'],['今天的你，已經比昨天更靠近想成為的自己。','— 無名']
    ];
    const KEY='daily-classic-quote-v1'; let quotes=loadQuotes(); let favorites=load('favorites',[]); let onlyFavorites=false; let currentIndex=getDailyIndex(quotes.length);
    const $=id=>document.getElementById(id); const quoteEl=$('quote'), authorEl=$('author'), favoriteBtn=$('favorite');
    function getDailyIndex(len){const day=Math.floor((Date.now()-3600000)/86400000);return ((day%len)+len)%len;}
    function load(key,fallback){try{return JSON.parse(localStorage.getItem(KEY+'-'+key))??fallback}catch{return fallback}}
    function save(key,value){try{localStorage.setItem(KEY+'-'+key,JSON.stringify(value))}catch{}}
    function loadQuotes(){const stored=load('quotes',null);return Array.isArray(stored)&&stored.length?stored:defaultQuotes.map(x=>[...x])}
    function render(){if(currentIndex<0||currentIndex>=quotes.length) currentIndex=0; const [text,person]=quotes[currentIndex]; const full='「'+text+'」'; quoteEl.replaceChildren(); const primary=document.createElement('span');primary.textContent=full; quoteEl.append(primary); const showAuthor=person&&person!=='— 無名';authorEl.textContent=showAuthor?person:'';authorEl.hidden=!showAuthor; const loved=favorites.includes(currentIndex); favoriteBtn.textContent=loved?'♥':'♡'; favoriteBtn.classList.toggle('is-favorite',loved); favoriteBtn.setAttribute('aria-label',loved?'取消收藏這句':'收藏這句'); $('count').textContent=quotes.length; $('listCount').textContent=quotes.length; requestAnimationFrame(updateMarquee); renderList();}
    function updateMarquee(){const primary=quoteEl.firstElementChild;const viewport=quoteEl.parentElement;if(!primary||!viewport)return;quoteEl.classList.remove('is-marquee');quoteEl.style.width='max-content';quoteEl.style.whiteSpace='nowrap';const textWidth=Math.ceil(quoteEl.getBoundingClientRect().width);const viewWidth=viewport.clientWidth;quoteEl.style.width='';quoteEl.style.whiteSpace='';const canAnimate=!window.matchMedia('(prefers-reduced-motion: reduce)').matches&&viewWidth>0&&textWidth>0;const endX=-(textWidth+24);const duration=Math.max(8,(viewWidth-endX)/75);quoteEl.style.setProperty('--marquee-start',viewWidth+'px');quoteEl.style.setProperty('--marquee-end',endX+'px');quoteEl.style.setProperty('--marquee-duration',duration.toFixed(2)+'s');quoteEl.classList.toggle('is-marquee',canAnimate);}
    function renderList(){const list=$('quoteList'); list.innerHTML=''; const shown=quotes.map((q,i)=>({q,i})).filter(x=>!onlyFavorites||favorites.includes(x.i)); if(!shown.length){list.innerHTML='<div class="empty">還沒有收藏名句，先按上方 ♡ 收藏吧。</div>';return} shown.forEach(({q,i})=>{const b=document.createElement('button');b.className='quote-item'+(i===currentIndex?' current':'');b.type='button';b.innerHTML='「'+escapeHtml(q[0])+'」<small>'+escapeHtml(q[1])+'</small>';b.addEventListener('click',()=>{currentIndex=i;render();});list.append(b);});}
    function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    $('next').addEventListener('click',()=>{const options=onlyFavorites?favorites:quotes.map((_,i)=>i);if(!options.length)return;const p=options.indexOf(currentIndex);currentIndex=options[(p+1+options.length)%options.length];render();});
    favoriteBtn.addEventListener('click',()=>{favorites=favorites.includes(currentIndex)?favorites.filter(i=>i!==currentIndex):[...favorites,currentIndex];save('favorites',favorites);render();});
    $('filter').addEventListener('click',()=>{onlyFavorites=!onlyFavorites;$('filter').classList.toggle('is-active',onlyFavorites);$('filter').setAttribute('aria-pressed',onlyFavorites);$('filter').textContent=onlyFavorites?'顯示全部':'只看收藏';$('listDetails').open=true;renderList();});
    $('manage').addEventListener('click',()=>{$('editQuote').value=quotes[currentIndex][0];$('editAuthor').value=quotes[currentIndex][1];$('deleteQuote').disabled=quotes.length<=1;$('editor').showModal();});
    $('save').addEventListener('click',()=>{const q=$('editQuote').value.trim(),a=$('editAuthor').value.trim();if(!q||!a)return;quotes[currentIndex]=[q,a];save('quotes',quotes);render();});
    $('addNew').addEventListener('click',()=>{const q=$('editQuote').value.trim(),a=$('editAuthor').value.trim();if(!q||!a)return;quotes.push([q,a]);currentIndex=quotes.length-1;save('quotes',quotes);render();});
    $('deleteQuote').addEventListener('click',()=>{if(quotes.length<=1)return;if(confirm('確定要刪除目前這句名句嗎？')){quotes.splice(currentIndex,1);favorites=favorites.filter(i=>i!==currentIndex).map(i=>i>currentIndex?i-1:i);if(currentIndex>=quotes.length)currentIndex=quotes.length-1;save('quotes',quotes);save('favorites',favorites);$('editor').close();render();}});
    $('reset').addEventListener('click',()=>{if(confirm('要還原全部預設名句與收藏嗎？')){quotes=defaultQuotes.map(x=>[...x]);favorites=[];save('quotes',quotes);save('favorites',favorites);currentIndex=getDailyIndex(quotes.length);$('editor').close();render();}});
    function createLeaves(){const field=document.createElement('div');field.className='leaf-field';field.setAttribute('aria-hidden','true');const count=14;for(let i=0;i<count;i++){const leaf=document.createElement('span');leaf.className='leaf';leaf.textContent='🍁';leaf.style.setProperty('--x',((i*17+5)%97)+'%');leaf.style.setProperty('--size',(13+(i%5)*4)+'px');leaf.style.setProperty('--duration',(11+((i*3)%8))+'s');leaf.style.setProperty('--delay',(-(i*1.15))+'s');leaf.style.setProperty('--drift',((i%2?1:-1)*(10+(i%5)*6))+'px');leaf.style.setProperty('--hue',(18+(i%4)*5)+'deg');leaf.style.setProperty('--alpha',(0.42+(i%3)*0.07).toFixed(2));field.append(leaf);}$('quote').closest('.quote-card').prepend(field);}
    createLeaves();const bgParam=new URLSearchParams(location.search).get('bg');if(bgParam)document.documentElement.style.setProperty('--page-bg',bgParam==='transparent'?'transparent':'#'+bgParam.replace(/^#/,''));window.addEventListener('resize',updateMarquee);new ResizeObserver(updateMarquee).observe($('quote').parentElement);if(document.fonts)document.fonts.ready.then(updateMarquee);render();
  </script>
</body>
</html>
